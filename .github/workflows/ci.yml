name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Validate lefthook config
        run: npx --yes lefthook validate

      - name: Install Angular dependencies
        run: npm --prefix angular ci

      - name: TypeScript type check
        run: cd angular && npx tsc --noEmit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-compile:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - iam
          - catalog
          - inventory
          - cart
          - order
          - payment
          - shipping
          - notification
          - analytics
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile ${{ matrix.service }}
        run: mvn compile -q -f ${{ matrix.service }}/pom.xml

  angular-build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install dependencies
        run: npm --prefix angular ci

      - name: Build Angular
        run: npx --prefix angular ng build

  integration:
    needs: [maven-compile, angular-build]
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: vmgriffes
      POSTGRES_PASSWORD: vmgriffes_ci
      POSTGRES_DB: vmgriffes
      POSTGRES_PORT: 5432
      KAFKA_PORT: 9094
      KAFKA_NODE_ID: 1
      CADDY_HTTP_PORT: 80
      CADDY_HTTPS_PORT: 443
      ZIPKIN_PORT: 9411
      KAFKA_UI_PORT: 8081
      ZIPKIN_MEM: 256m
    steps:
      - uses: actions/checkout@v6

      - name: Create .env file
        shell: bash
        run: |
          cat > .env <<'ENVEOF'
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          KAFKA_PORT=${KAFKA_PORT}
          KAFKA_NODE_ID=${KAFKA_NODE_ID}
          CADDY_HTTP_PORT=${CADDY_HTTP_PORT}
          CADDY_HTTPS_PORT=${CADDY_HTTPS_PORT}
          ZIPKIN_PORT=${ZIPKIN_PORT}
          KAFKA_UI_PORT=${KAFKA_UI_PORT}
          ZIPKIN_MEM=${ZIPKIN_MEM}
          ENVEOF

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Verify all containers healthy
        shell: bash
        run: |
          for c in vmgriffes-postgresql vmgriffes-kafka vmgriffes-kafka-ui vmgriffes-zipkin; do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c" 2>/dev/null || echo "missing")
            if [ "$status" != "healthy" ] && [ "$status" != "none" ]; then
              echo "FAIL: $c is $status"
              docker compose logs "$c" 2>/dev/null | tail -20 || true
              exit 1
            fi
            echo "OK: $c is $status"
          done

      - name: Teardown
        if: always()
        run: docker compose down -v
